
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shin Chan Season 15</title>
 <link rel="icon" href="https://ik.imagekit.io/garrywebworld/compressed_Shin%20Chan%20GitHub%20Octocat%20Favicon.png?updatedAt=1785423963862" type="image/png">
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
.hero{position:relative;height:85vh;display:flex;align-items:center}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.3)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#111 0%,rgba(0,0,0,.2))}
.wrap{position:relative;z-index:2;width:92%;max-width:1300px;margin:auto;display:flex;justify-content:space-between;gap:40px}
.left{max-width:650px}.left h1{font-size:58px;margin:0 0 12px}.btn{display:inline-block;margin-top:24px;padding:16px 30px;background:#ff3b30;color:#fff;text-decoration:none;border-radius:12px;font-weight:bold}
.right{width:360px}.glass{background:rgba(255,255,255,.08);backdrop-filter:blur(16px);border-radius:18px;padding:20px;margin-bottom:18px;border:1px solid rgba(255,255,255,.1)}
.highlight{display:flex;gap:15px;align-items:center}.highlight img{width:120px;height:80px;object-fit:cover;border-radius:12px}
.player{max-width:1100px;margin:40px auto;padding:0 16px}
video{width:100%;border-radius:14px;background:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:20px}
.grid button{padding:12px;border:none;border-radius:10px;background:#202020;color:#fff;cursor:pointer}
.grid button:hover{background:#ff3b30}
</style>
</head>
<body>
<section class="hero">
<img class="bg" src="https://ik.imagekit.io/garrywebworld/263671753180860447.jpg">
<div class="wrap">
<div class="left">
<h1>Shin Chan Season 15 (Hindi HD)</h1>
<p>Watch all available episodes in HD quality with the built‑in player.</p>
<a class="btn" href="#player">▶ Watch Now</a>
</div>
<div class="right">
<div class="glass">
<h2>Information</h2>
<p>Language: Hindi</p>
<p>Season: 15</p>
<p>Quality: HD</p>
<p>Total Episodes: 43</p>
</div>
<div class="glass highlight">
<img src="https://ik.imagekit.io/garrywebworld/11681280278682191.jpg">
<div><h3>Season 15 Highlights</h3><p>43 Hindi dubbed episodes.</p></div>
</div>
</div>
</div>
</section>

<section class="player" id="player">
<video id="video" controls playsinline>
<source id="source" src="https://ia600600.us.archive.org/8/items/shin-chan-s-15-hindi-ep-01-1/ShinChanS15HindiEP04.mp4" type="video/mp4">
</video>

<div class="grid" id="episodes"></div>
</section>

<script>
const eps=[
{ep:"02",url:"https://ia600600.us.archive.org/8/items/shin-chan-s-15-hindi-ep-01-1/ShinChanS15HindiEP02~1.mp4"},
{ep:"04",url:"https://ia600600.us.archive.org/8/items/shin-chan-s-15-hindi-ep-01-1/ShinChanS15HindiEP04.mp4"},
{ep:"05",url:"https://ia600600.us.archive.org/8/items/shin-chan-s-15-hindi-ep-01-1/ShinChanS15HindiEP05~1%20-%20Copy.mp4"}
];
for(let i=8;i<=52;i++){
 if([10,19,20].includes(i)) continue;
 eps.push({ep:String(i).padStart(2,"0"),url:`https://ia600600.us.archive.org/8/items/shin-chan-s-15-hindi-ep-01-1/ShinChanS15HindiEP${String(i).padStart(2,"0")}${i===46?".mp4":"~1.mp4"}`});
}
const grid=document.getElementById("episodes"),v=document.getElementById("video"),s=document.getElementById("source");
eps.forEach(e=>{
 const b=document.createElement("button");
 b.textContent="Episode "+e.ep;
 b.onclick=()=>{s.src=e.url;v.load();v.play();window.scrollTo({top:document.getElementById("player").offsetTop-20,behavior:"smooth"});}
 grid.appendChild(b);
});
</script>
</body>
</html>
