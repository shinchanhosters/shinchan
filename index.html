<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>My Shows — Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="https://ik.imagekit.io/garrywebworld/compressed_Shin%20Chan%20GitHub%20Octocat%20Favicon.png" type="image/png">
   
</head>
<body>
</div>

<div class="container">
    <header class="home-header">
        <h1>Shows</h1>
        <input id="season-search" class="search" placeholder="Search seasons or titles..." aria-label="Search seasons">
    </header>
    <div id="seasons" class="season-grid"></div>
</div>

<script>
async function load() {
    const res = await fetch('data/seasons.json');
    const seasons = await res.json();
    const grid = document.getElementById('seasons');
    const search = document.getElementById('season-search');

    function render(list){
        grid.innerHTML = '';
        list.forEach(s => {
            const card = document.createElement('a');
            card.className = 'season-card';
            card.href = `season.html?id=${encodeURIComponent(s.id)}`;
            card.innerHTML = `
                <img src="${s.banner}" alt="${s.title}" class="banner"/>
                <div class="meta">
                    <h2>${s.title}</h2>
                    <p>${s.description || ''}</p>
                </div>`;
            grid.appendChild(card);
        });
    }

    render(seasons);

    search.addEventListener('input', (e) => {
        const q = e.target.value.trim().toLowerCase();
        if(!q) return render(seasons);
        render(seasons.filter(s => (s.title + ' ' + (s.description||'')).toLowerCase().includes(q)));
    });
}

document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
